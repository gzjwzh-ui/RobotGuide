name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v5

    - name: ☕ Setup JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: 🤖 Configure Android SDK
      run: |
        echo "ANDROID_HOME=$ANDROID_HOME"
        ls -la $ANDROID_HOME
        # Install platform 34 and build-tools (using preinstalled sdkmanager)
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" > /dev/null 2>&1 || true
        echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
        echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
        ls -la $ANDROID_HOME/platforms/android-34/ 2>/dev/null || echo "platform-34 not installed"

    - name: 🔨 Generate Gradle Wrapper (v8.1)
      run: |
        cd /tmp
        curl -fsSL https://services.gradle.org/distributions/gradle-8.1-bin.zip -o gradle.zip
        unzip -q gradle.zip
        export PATH=/tmp/gradle-8.1/bin:$PATH
        cd "$GITHUB_WORKSPACE"
        gradle wrapper --gradle-version 8.1
        ls -la gradlew gradlew.bat gradle/wrapper/gradle-wrapper.jar
        chmod +x gradlew

    - name: 🔧 Build debug APK
      run: |
        set -o pipefail
        ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee build_output.txt

    - name: 📝 Print build log on failure
      if: failure()
      run: |
        # Extract error lines and output as GitHub Actions annotations
        grep -E "^e:|error:|FAILURE|What went wrong" build_output.txt | head -n 20 || true
        # Also output to step summary
        echo "### Build Output (last 100 lines)" >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
        tail -n 100 build_output.txt >> $GITHUB_STEP_SUMMARY || true
        echo '```' >> $GITHUB_STEP_SUMMARY

    - name: 📤 Upload build log on failure
      if: failure()
      uses: actions/upload-artifact@v5
      with:
        name: build-log
        path: build_output.txt
        if-no-files-found: ignore
        retention-days: 7

    - name: 📦 Upload APK artifact
      uses: actions/upload-artifact@v5
      with:
        name: RobotGuide-APK
        path: app/build/outputs/apk/debug/*.apk
        if-no-files-found: error
        retention-days: 30

    - name: 🔔 Build summary
      if: always()
      run: |
        echo "### RobotGuide APK built" >> "$GITHUB_STEP_SUMMARY"
        echo "- Backend: http://192.168.0.251:5000" >> "$GITHUB_STEP_SUMMARY"
        echo "- Model: doubao-seed-character-260628" >> "$GITHUB_STEP_SUMMARY"
        echo "- Min SDK: 23 (Android 6.0)" >> "$GITHUB_STEP_SUMMARY"
